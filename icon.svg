<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Safar Saathi">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8faf6"/>
      <stop offset="100%" stop-color="#b8ebe0"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f766e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded background -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#bgGrad)"/>
  <!-- Soft inner circle -->
  <circle cx="64" cy="58" r="40" fill="#ffffff" opacity="0.55"/>
  <!-- Main location pin -->
  <g filter="url(#softShadow)">
    <path d="M64 18 C42 18 26 34 26 54 C26 78 64 110 64 110 C64 110 102 78 102 54 C102 34 86 18 64 18 Z" fill="url(#pinGrad)"/>
    <!-- Inner white circle -->
    <circle cx="64" cy="52" r="14" fill="#ffffff"/>
    <!-- Small teal dot -->
    <circle cx="64" cy="52" r="6" fill="#0d9488"/>
  </g>
  <!-- Subtle path/route line at bottom -->
  <path d="M28 92 C42 84 52 86 64 90 C76 94 88 90 100 84" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
</svg>
